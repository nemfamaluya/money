<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1f2a2a;--mu:#6b7777;--ac:#0f766e;--bad:#c2410c;--ok:#15803d;--bd:#e4e0d6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1c2522;--tx:#e8eeec;--mu:#92a29e;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--bd:#2a3733}}
:root[data-theme="dark"]{--bg:#121816;--card:#1c2522;--tx:#e8eeec;--mu:#92a29e;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--bd:#2a3733}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
main{max-width:560px;margin:auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto;padding:9px 14px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--ac)}
img.th{width:40px;height:40px;object-fit:cover;border-radius:8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.fb{display:block;text-align:center;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;cursor:pointer}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const CATS=["Food","Transport","Shopping","Health","Fun","Other"];
const KEY="mtracker2";
let S={set:{salary:0,phpPerRub:0.7,phpPerUsd:57,fee:2},exp:[],bills:[
{id:1,name:"Apartment rent",cur:"RUB",est:0,day:5,var:0},{id:2,name:"Wi-Fi",cur:"RUB",est:0,day:10,var:0},
{id:3,name:"Electricity",cur:"RUB",est:0,day:15,var:1},{id:4,name:"Water",cur:"RUB",est:0,day:15,var:1},
{id:5,name:"BDO credit card",cur:"PHP",est:0,day:20,var:1},{id:6,name:"Citibank card",cur:"USD",est:0,day:20,var:1},
{id:7,name:"BOA card",cur:"USD",est:0,day:20,var:1},{id:8,name:"Maya card",cur:"PHP",est:0,day:20,var:1},
{id:9,name:"Globe phone",cur:"PHP",est:0,day:15,var:0},{id:10,name:"SSS (mine)",cur:"PHP",est:0,day:25,var:0,fr:3,st:1},
{id:11,name:"SSS (mom)",cur:"PHP",est:0,day:25,var:0,fr:3,st:1},{id:12,name:"Pag-IBIG",cur:"PHP",est:0,day:25,var:0,fr:3,st:1},
{id:13,name:"PhilHealth",cur:"PHP",est:0,day:25,var:0,fr:3,st:1}],pay:{}};
try{let r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);else{r=localStorage.getItem("mtracker1");if(r){const o=JSON.parse(r);S.set=o.set;S.exp=o.exp}}}catch(e){}
S.set.bdo=S.set.bdo||"Savings";S.tr=(S.tr||[]).filter(t=>t.kind!="USD");
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const due=b=>{if((b.fr||1)==1)return true;return(((new Date().getMonth()-(b.st-1))%3)+3)%3==0};
const mo=b=>b.fr==3?`<br><span class="mu">every 3 months, starting </span><select style="width:75px;padding:4px" onchange="S.bills.find(x=>x.id==${b.id}).st=+this.value;save()">${MN.map((m,i)=>`<option value="${i+1}" ${b.st==i+1?"selected":""}>${m}</option>`).join("")}</select>`:"";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Storage full — delete some old receipt photos.")}}
let tab="home",mode="half",off=0,pend=null;
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const sym={RUB:"₽",PHP:"₱",USD:"$"};
const f=(n,c)=>(sym[c]||"")+Math.round(n).toLocaleString();
const toRub=(a,c)=>{const s=S.set;if(c=="RUB")return a;const fee=1+s.fee/100;return(c=="PHP"?a/s.phpPerRub:a*s.phpPerUsd/s.phpPerRub)*fee};
function halfOf(d){const y=d.getFullYear(),m=d.getMonth(),t=d.getDate();
 if(t>=26)return[new Date(y,m,26),new Date(y,m+1,10)];if(t<=10)return[new Date(y,m-1,26),new Date(y,m,10)];return[new Date(y,m,11),new Date(y,m,25)]}
function range(){const n=new Date();let a,b;
 if(mode=="week"){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off*7);const k=(d.getDay()+6)%7;a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-k);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6)}
 else if(mode=="month"){a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0)}
 else{let d=n;for(let i=0;i<Math.abs(off);i++){const h=halfOf(d);d=off<0?new Date(h[0].getFullYear(),h[0].getMonth(),h[0].getDate()-1):new Date(h[1].getFullYear(),h[1].getMonth(),h[1].getDate()+1)}[a,b]=halfOf(d)}
 return[iso(a),iso(b),a,b]}
const mk=()=>{const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)};
const billAmt=b=>{const p=S.pay[b.id+"|"+mk()];return p&&p.amt!=null&&p.amt!==""?+p.amt:b.est};
function monthPlan(){const s=S.set,m=mk(),inc=s.salary*2;
 let bills=0,php=0,usd=0,rub=0,ub={},pl=[];
 S.bills.filter(due).forEach(b=>{const a=billAmt(b);bills+=toRub(a,b.cur);if(b.cur=="PHP"){php+=a;pl.push([b.name,a])}else if(b.cur=="USD"){usd+=a;ub[b.name]=(ub[b.name]||0)+a}else rub+=a});
 const exc={RUB:0,PHP:0,USD:0};let ex=0;
 S.exp.filter(e=>e.date.startsWith(m)).forEach(e=>{exc[e.cur]+=e.amt;ex+=toRub(e.amt,e.cur)});
 const T=k=>S.tr.filter(t=>t.date.startsWith(m)&&t.kind==k),sm=(a,k)=>a.reduce((t,x)=>t+x[k],0);
 const tp=T("PHP"),tu=T("PUSD"),k=1+s.fee/100,nP=php+exc.PHP,nU=usd+exc.USD;
 const pesosForUsd=tu.length?sm(tu,"rub"):nU*s.phpPerUsd;
 const outR=tp.length?sm(tp,"rub"):(nP+pesosForUsd)/s.phpPerRub*k;
 const poolP=tp.length?sm(tp,"got")-nP-pesosForUsd:0,poolU=tu.length?sm(tu,"got")-nU:0;
 const left=inc-rub-exc.RUB-outR+poolP/s.phpPerRub+poolU*s.phpPerUsd/s.phpPerRub;
 return{inc,bills,ex,left,php,usd,rub,ub,pl,nP,nU,tp,tu,outR,poolP,poolU,exc,pesosForUsd}}
function render(){
 const nav=[["home","Home"],["exp","Receipts"],["bills","Bills"],["xfer","Transfers"],["set","Setup"]];
 $("#nav").innerHTML=nav.map(x=>`<button class="${tab==x[0]?"on":""}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join("");
 $("#app").innerHTML=({home,exp,bills,xfer,set})[tab]();window.scrollTo(0,0)}
function seg(){const[a,b,A,B]=range();const o=d=>d.toLocaleDateString("en",{month:"short",day:"numeric"});
 return`<div class="seg">${["week","half","month"].map(m=>`<button class="${mode==m?"on":""}" onclick="mode='${m}';off=0;render()">${m=="half"?"Pay period":m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>
 <div class="row"><button class="s" onclick="off--;render()">‹</button><b>${o(A)} – ${o(B)}</b><button class="s" onclick="off++;render()">›</button></div>`}
function inRange(){const[a,b]=range();return S.exp.filter(e=>e.date>=a&&e.date<=b)}
function home(){const p=monthPlan(),l=inRange(),tot={};l.forEach(e=>tot[e.cat]=(tot[e.cat]||0)+toRub(e.amt,e.cur));
 const sum=Object.values(tot).reduce((a,b)=>a+b,0);
 return`<h1>My Money 💸</h1>${S.set.drive&&(!S.set.bk||Date.now()-S.set.bk>6048e5)?`<div class="card bad">⚠️ Time to back up — Setup → Back up now</div>`:""}
 <div class="card"><div class="mu">Expected savings this month</div>
 <div class="big ${p.left<0?"bad":"ok"}">${f(p.left,"RUB")}</div>
 <div class="mu">${S.set.salary?"":"Set your salary in Setup. "}Income ${f(p.inc,"RUB")}, after bills, spending and your transfers (see Transfers tab)</div></div>
 <div class="card"><h2>Spending</h2>${seg()}<div class="big">${f(sum,"RUB")}</div>
 ${Object.keys(tot).sort((a,b)=>tot[b]-tot[a]).map(c=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${c}</span><span>${f(tot[c],"RUB")}</span></div><div class="bar"><i style="width:${tot[c]/sum*100}%"></i></div></div>`).join("")||'<div class="mu">No receipts in this range yet.</div>'}</div>`}
function exp(){const l=inRange().sort((a,b)=>b.date.localeCompare(a.date));
 return`<h1>Receipts</h1><div class="card"><h2>Add expense</h2>
 <div class="g"><input id="ea" type="number" inputmode="decimal" placeholder="Amount"><select id="ec">${["RUB","PHP","USD"].map(c=>`<option>${c}</option>`)}</select>
 <select id="et">${CATS.map(c=>`<option>${c}</option>`)}</select><input id="ed" type="date" value="${iso(new Date())}"></div>
 <input id="en" placeholder="Note (store, item)" style="margin-bottom:8px">
 <div class="g"><label class="fb">📷 Take photo<input type="file" accept="image/*" capture="environment" onchange="photo(this)" hidden></label><label class="fb">🖼️ From gallery<input type="file" accept="image/*" onchange="photo(this)" hidden></label></div><button onclick="addExp()" style="width:100%">Save</button>
 <div class="mu" id="pm">📷 Take a photo or pick one from your gallery (optional)</div></div>
 <div class="card"><h2>List</h2>${seg()}${l.map(e=>`<div class="row"><div style="display:flex;gap:8px;align-items:center">${e.img?`<img class="th" src="${e.img}" onclick="big('${e.id}')">`:""}${e.link?`<a href="${e.link}" target="_blank" style="font-size:26px;text-decoration:none">📎</a>`:""}<div><div>${e.note||e.cat}</div><div class="mu">${e.date} · ${e.cat}</div></div></div><div style="text-align:right"><b>${f(e.amt,e.cur)}</b><br><span class="mu" onclick="delExp('${e.id}')">delete</span></div></div>`).join("")||'<div class="mu">Nothing here.</div>'}</div>`}
function photo(i){const fl=i.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pend=c.toDataURL("image/jpeg",.6);$("#pm").textContent="✅ Photo attached"};im.src=r.result};r.readAsDataURL(fl)}
async function addExp(){const a=+$("#ea").value;if(!a)return alert("Enter an amount");
const e={id:Date.now()+"",date:$("#ed").value,amt:a,cur:$("#ec").value,cat:$("#et").value,note:$("#en").value,img:pend};pend=null;
if(e.img&&S.set.drive){$("#pm").textContent="Uploading to Drive…";try{const r=await fetch(S.set.drive,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({name:e.date+"_"+e.cat+"_"+a+".jpg",data:e.img})});const j=await r.json();if(j.url){e.link=j.url;e.img=null}else throw 0}catch(x){alert("Drive upload failed — the photo is kept on this device for now.")}}
S.exp.push(e);save();render()}
function delExp(id){if(confirm("Delete this expense?")){S.exp=S.exp.filter(e=>e.id!=id);save();render()}}
function big(id){const e=S.exp.find(x=>x.id==id);const w=window.open();if(w)w.document.write('<img style="max-width:100%" src="'+e.img+'">')}
function bills(){const t=new Date().getDate(),m=mk();const pm=new Date();pm.setMonth(pm.getMonth()-1);const pk=pm.getFullYear()+"-"+pad(pm.getMonth()+1);
 const L=S.bills.filter(due).sort((a,b)=>a.day-b.day);
 return`<h1>Bills — ${new Date().toLocaleDateString("en",{month:"long"})}</h1>${L.map(b=>{const p=S.pay[b.id+"|"+m]||{},prev=S.pay[b.id+"|"+pk],paid=p.paid,late=!paid&&b.day<t,soon=!paid&&b.day>=t&&b.day-t<=3;
 return`<div class="card"><div class="row" style="border:0;padding:0"><b>${b.name}</b><span class="pill ${late?"bad":""}">${paid?"✅ paid":late?"overdue":soon?"due in "+(b.day-t)+"d":"due "+b.day+"th"}</span></div>
 <div class="mu">${(b.fr||1)==3?"Every 3 months":b.var?"Varies monthly":"Fixed"} · ${b.cur}${prev&&prev.amt?" · last month "+f(prev.amt,b.cur):""}</div>
 <div class="g" style="margin:8px 0 0"><input type="number" inputmode="decimal" value="${p.amt??(b.est||"")}" placeholder="Amount ${sym[b.cur]}" onchange="setBill(${b.id},'amt',this.value)"><button class="${paid?"s":""}" onclick="setBill(${b.id},'paid',${!paid})">${paid?"Undo":"Mark paid"}</button></div></div>`}).join("")}
 <div class="card"><h2>Add a bill</h2><div class="g"><input id="bn" placeholder="Name"><select id="bc">${["RUB","PHP","USD"].map(c=>`<option>${c}</option>`)}</select><input id="bd" type="number" placeholder="Due day (1-31)"><input id="be" type="number" placeholder="Usual amount"><select id="bf"><option value="1">Monthly</option><option value="3">Every 3 months</option></select></div><button onclick="addBill()">Add</button></div>`}
function setBill(id,k,v){const key=id+"|"+mk();S.pay[key]=S.pay[key]||{};S.pay[key][k]=v;save();render()}
function addBill(){const n=$("#bn").value;if(!n)return;S.bills.push({id:Date.now(),name:n,cur:$("#bc").value,est:+$("#be").value||0,day:+$("#bd").value||1,var:1,fr:+$("#bf").value,st:new Date().getMonth()+1});save();render()}
function xfer(){const p=monthPlan(),m=mk(),mv=S.tr.filter(t=>t.date.startsWith(m)&&t.kind=="RUB").reduce((a,t)=>a+t.rub,0);
 const L=S.tr.filter(t=>t.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
 const st=(pool,c)=>`<b class="${pool<0?"bad":"ok"}">${pool<0?"short ":"extra "}${f(Math.abs(pool),c)}</b>`;
 const lab={PHP:"₽ → pesos in my BDO",PUSD:"₱ → friend's BDO → $ in my US bank",RUB:"₽ → my own Russian bank"};
 const sub=t=>t.kind=="RUB"?"moved "+f(t.rub,"RUB"):t.kind=="PHP"?"sent "+f(t.rub,"RUB")+" → got "+f(t.got,"PHP")+" ("+(t.got/t.rub).toFixed(3)+" ₱ per ₽)":"sent "+f(t.rub,"PHP")+" → got "+f(t.got,"USD")+" ("+(t.rub/t.got).toFixed(2)+" ₱ per $)";
 return`<h1>Money moves</h1>
 <div class="card"><h2>What you need this month</h2>
 <div class="row"><span>Pesos in BDO for PH bills &amp; ₱ spending</span><b>${f(p.nP,"PHP")}</b></div>
 ${p.pl.map(x=>`<div class="row mu"><span>&nbsp;&nbsp;${x[0]}</span><span>${f(x[1],"PHP")}</span></div>`).join("")}
 <div class="row"><span>Pesos to pay your USD friend</span><b>${f(p.pesosForUsd,"PHP")}</b></div>
 <div class="row"><span>Dollars needed in US bank</span><b>${f(p.nU,"USD")}</b></div>
 ${Object.keys(p.ub).map(n=>`<div class="row mu"><span>&nbsp;&nbsp;→ ${n.replace(" card","")} savings</span><span>${f(p.ub[n],"USD")}</span></div>`).join("")}</div>
 <div class="card"><h2>Log a transfer</h2>
 <div class="mu" style="margin-bottom:8px">Enter what you really sent and got.</div>
 <div class="g"><select id="tk" onchange="tkc()" style="grid-column:1/3"><option value="PHP">Rubles → other person's Russian bank (she sends pesos to my BDO)</option><option value="PUSD">Pesos in my BDO → friend's BDO (she sends USD to my US bank)</option><option value="RUB">Rubles → my own Russian bank</option></select>
 <input id="td" type="date" value="${iso(new Date())}"><input id="tr" type="number" inputmode="decimal" placeholder="Rubles I sent ₽">
 <input id="tg" type="number" inputmode="decimal" placeholder="Pesos received ₱" style="grid-column:1/3"></div>
 <button onclick="addTr()">Save transfer</button></div>
 <div class="card"><h2>Transfers this month</h2>${L.map(t=>`<div class="row"><div><div>${lab[t.kind]} · ${t.date}</div><div class="mu">${sub(t)}</div></div><span class="mu" onclick="delTr('${t.id}')">delete</span></div>`).join("")||'<div class="mu">None logged yet — until you log one, the app assumes you send exactly what you need.</div>'}</div>
 <div class="card"><h2>After everything</h2>
 <div class="row"><span>Salary (2 paydays)</span><b>${f(p.inc,"RUB")}</b></div>
 <div class="row"><span>Rubles sent to the peso supplier</span><b>${f(p.outR,"RUB")}</b></div>
 <div class="row"><span>Moved to my own Russian bank (still yours)</span><b>${f(mv,"RUB")}</b></div>
 <div class="row"><span>Russia bills &amp; spending</span><b>${f(p.rub+p.exc.RUB,"RUB")}</b></div>
 <div class="row"><span>BDO: pesos received vs needed</span>${p.tp.length?st(p.poolP,"PHP"):'<span class="mu">no transfer yet</span>'}</div>
 <div class="row"><span>US bank: dollars received vs needed</span>${p.tu.length?st(p.poolU,"USD"):'<span class="mu">no transfer yet</span>'}</div>
 <div class="mu" style="margin-top:8px">Estimated savings</div><div class="big ${p.left<0?"bad":"ok"}">${f(p.left,"RUB")}</div>
 <div class="mu">Extra pesos/dollars count as savings at your Setup rates. "Short" means you need to send more.</div></div>`}
function tkc(){const k=$("#tk").value;$("#tr").placeholder=k=="PUSD"?"Pesos I sent ₱":"Rubles I sent ₽";$("#tg").placeholder=k=="PUSD"?"Dollars received $":"Pesos received ₱";$("#tg").style.display=k=="RUB"?"none":""}
function addTr(){const k=$("#tk").value,r=+$("#tr").value,g=k=="RUB"?r:+$("#tg").value;if(!r||!g)return alert("Enter the amount sent and the amount received");S.tr.push({id:Date.now()+"",date:$("#td").value,kind:k,rub:r,got:g});save();render()}
function delTr(id){if(confirm("Delete this transfer?")){S.tr=S.tr.filter(t=>t.id!=id);save();render()}}
function set(){const s=S.set;const inp=(k,l,st)=>`<label class="mu">${l}</label><input type="number" step="${st||"any"}" value="${s[k]}" onchange="S.set.${k}=+this.value;save()" style="margin-bottom:8px">`;
 return`<h1>Setup</h1><div class="card">${inp("salary","Salary per payday (₽) — paid on the 11th & 26th")}${inp("phpPerRub","Rate: ₱ per 1 ₽")}${inp("phpPerUsd","Rate: ₱ per $1")}${inp("fee","Transfer cost on foreign money (%)")}<label class="mu">BDO account that receives your money</label><select onchange="S.set.bdo=this.value;save()"><option ${s.bdo=="Savings"?"selected":""}>Savings</option><option ${s.bdo=="Current"?"selected":""}>Current</option></select><label class="mu">Google Drive upload address (from Apps Script)</label><input value="${s.drive||""}" placeholder="https://script.google.com/macros/s/…/exec" onchange="S.set.drive=this.value.trim();save()"></div>
 <div class="card"><h2>Bills</h2>${S.bills.map(b=>`<div class="row"><span>${b.name} <span class="mu">(${b.cur}) due day </span><input type="number" min="1" max="31" style="width:60px;padding:4px" value="${b.day}" onchange="S.bills.find(x=>x.id==${b.id}).day=+this.value;save()">${mo(b)}</span><span><input type="number" style="width:90px" value="${b.est}" onchange="S.bills.find(x=>x.id==${b.id}).est=+this.value;save()"> <span class="mu" onclick="S.bills=S.bills.filter(x=>x.id!=${b.id});save();render()">✕</span></span></div>`).join("")}<div class="mu">Numbers above are your usual amounts, used until you enter the real bill.</div></div>
 <div class="card"><h2>Backup</h2><div class="mu" id="bk">${s.bk?"Last backup: "+new Date(s.bk).toLocaleString():"Not backed up yet"}</div><div class="g" style="margin-top:8px"><button onclick="doBackup()">Back up now</button><button class="s" onclick="doRestore()">Restore</button></div><div class="mu">New phone? Open the app, paste your Drive address above, then tap Restore.</div></div>`}
async function cloud(a,data){const r=await fetch(S.set.drive,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:a,data})});return r.json()}
async function doBackup(){if(!S.set.drive)return alert("Paste the Drive upload address first.");$("#bk").textContent="Backing up…";
try{S.set.bk=Date.now();const j=await cloud("backup",JSON.stringify({set:S.set,exp:S.exp,bills:S.bills,pay:S.pay,tr:S.tr}));if(!j.ok)throw 0;save();alert("Backed up to Drive ✅")}catch(e){alert("Backup failed. Check the Drive address and that you deployed the new script version.")}render()}
async function doRestore(){if(!S.set.drive)return alert("Paste the Drive upload address first.");if(!confirm("Replace everything on this device with your Drive backup?"))return;
try{const j=await cloud("restore");if(!j.ok||!j.data)return alert("No backup found in Drive yet.");const o=JSON.parse(j.data),dr=S.set.drive;S.set=o.set;S.set.drive=dr;S.exp=o.exp;S.bills=o.bills;S.pay=o.pay;S.tr=o.tr||[];save();alert("Restored ✅");tab="home";render()}catch(e){alert("Restore failed. Check the Drive address and the script version.")}}
render();
</script></body></html>
